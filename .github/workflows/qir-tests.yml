name: QIR event tests
on:
  push:
    paths: ['src/qir_event/**', 'tests/test_qir_event.py', 'requirements-qir.txt', '.github/workflows/qir-tests.yml']
  pull_request:
    paths: ['src/qir_event/**', 'tests/test_qir_event.py', 'requirements-qir.txt', '.github/workflows/qir-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qir.txt
      - run: python -m pip install -r requirements-qir.txt
      - run: python -m pytest tests/test_qir_event.py -q
